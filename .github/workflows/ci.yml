name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]" --break-system-packages

      - name: Run Ruff Lint
        run: uv run ruff check backend

      - name: Run Ruff Format Check
        run: uv run ruff format --check backend

      - name: Run Pytest (Offline & Filesystem Invariants)
        run: uv run pytest backend/tests/fs/ backend/tests/operations/test_engine.py
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-secret-key-12345
          DATABASE_URL: 'sqlite:///:memory:'
