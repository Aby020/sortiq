[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sortiq"
version = "0.1.0"
description = "Intelligent Desktop File Management Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Abi Thomas" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: File Management",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Django>=4.2,<5.1",
    "django-environ>=0.11",
    "django-filter>=24.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "python-multipart>=0.0.2",
    "filetype>=1.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = [
    "backend",
    "backend/apps",
    "backend/config",
    "backend/service",
    "backend/sortiq_fs",
]
asyncio_mode = "auto"
testpaths = ["backend"]

[tool.coverage.run]
source = ["backend"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools]
packages = []

[tool.setuptools.packages.find]
where = ["backend"]
include = ["apps*", "config*", "service*", "sortiq_fs*"]
